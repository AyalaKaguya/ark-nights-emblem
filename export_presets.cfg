; Export presets for ArkNight-Emblem
; Windows Desktop (x86_64) standalone build.
; NOTE: requires Windows export templates installed once (Editor > Project > Export > Install Export Templates).
; After templates are installed, export via Editor UI (Export Project) or CLI:
;   godot --headless --path . --export-release "Windows Desktop" build/ArkNight-Emblem.exe

[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
run_command_enabled=false
advance_to_next_preset=false
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/ArkNight-Emblem.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory_names=false
reloadable_export_templates=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=true
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
architectures/architecture="x86_64"
application/icon=""
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="ArkNight-Emblem"
application/product_name="ArkNight Emblem"
application/file_description="ArkNight Emblem"
application/copyright="ArkNight-Emblem"
application/trademark="ArkNight-Emblem"
